<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peruse — social preview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236551D6'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='18' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","PingFang SC",sans-serif;background:#EDEBF6;padding:20px}
.stage{width:1200px;height:630px;margin:0 auto;background:#6551D6;border-radius:18px;position:relative;overflow:hidden;display:grid;place-items:center}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:48px 48px}
.glow{position:absolute;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(247,217,120,.20),transparent 62%);top:-300px;right:-200px}
.inner{position:relative;z-index:1;text-align:center;padding:0 80px}
.mark{width:76px;height:76px;border-radius:18px;background:#fff;display:grid;place-items:center;color:#6551D6;font-family:Georgia,serif;font-size:40px;font-weight:700;margin:0 auto 26px}
h1{font-size:62px;line-height:1.06;letter-spacing:-2px;color:#fff;font-weight:800}
h1 em{font-style:normal;color:#F7D978}
.sub{margin-top:22px;font-size:19px;line-height:1.55;color:rgba(255,255,255,.82)}
.pills{display:flex;gap:10px;justify-content:center;margin-top:36px;flex-wrap:wrap}
.pill{padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.14);color:#fff}
.pill.cream{background:#F7D978;color:#4A3A05}
.foot{position:absolute;bottom:26px;left:0;right:0;display:flex;justify-content:space-between;padding:0 40px;font-size:12.5px;color:rgba(255,255,255,.62);z-index:1}
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="inner">
    <div class="mark">P</div>
    <h1>Read what you<br><em>actually</em> read.</h1>
    <p class="sub">A local-first Chrome extension that measures real reading time<br>and recommends five articles every night with your own LLM.</p>
    <div class="pills">
      <span class="pill">No history permission</span>
      <span class="pill">IndexedDB only</span>
      <span class="pill">12 providers</span>
      <span class="pill cream">AGPL-3.0</span>
    </div>
  </div>
  <div class="foot">
    <span>github.com/&lt;your-username&gt;/peruse</span>
    <span>zero servers · zero telemetry</span>
  </div>
</div>
</body>
</html>
